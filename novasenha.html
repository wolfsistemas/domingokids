    <style>
        /* ===== Cores suaves (estilo Videira) ===== */
        :root {
            --primary: #8b5a6a;
            --primary-hover: #7a4d5a;
            --bg-color: #fcf7f5;
            --text-main: #4a3b3e;
            --text-light: #7a6a6e;
            --input-bg: #fdfaf9;
            --border-color: #e6dcd8;
            --danger-text: #b34a4a;
            --success-text: #2d6a4f;
            --accent: #d4a373;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        #tela-redefinir {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 0.5rem;
        }

        .card-redefinir {
            background: #ffffff;
            padding: 2rem 1.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            max-height: 95vh;
            overflow-y: auto;
            margin: 0 auto;
        }

        .logo {
            width: 90px;
            height: auto;
            margin-bottom: 12px;
            border-radius: 50%;
        }

        .logo2 {
            width: 60px;
            height: auto;
            margin-bottom: 20px;            
        }

        h2 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 4px;
            font-weight: 700;
        }

        p.subtitulo {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-light);
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.85rem 0.9rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
            background-color: var(--input-bg);
            box-sizing: border-box;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.6rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #c9a7b3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background-color: #fdf8f6;
            transform: translateY(0);
        }

        .mensagem-erro,
        .mensagem-sucesso {
            font-size: 0.85rem;
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 8px;
            display: none;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .mensagem-erro {
            color: var(--danger-text);
            background: #fdf0ee;
            border-color: #f5d6d2;
        }

        .mensagem-sucesso {
            color: var(--success-text);
            background: #d1e7dd;
            border-color: #b8d9c0;
        }

        @media (max-width: 480px) {
            .card-redefinir {
                padding: 1.5rem 1.2rem;
            }
            .logo {
                width: 70px;
            }
            h2 {
                font-size: 1.1rem;
            }
            input {
                padding: 0.7rem 0.8rem;
                font-size: 0.9rem;
            }
            button {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
        }

<body>

    <!-- ===== TELA DE REDEFINIÇÃO DE SENHA ===== -->
    <div id="tela-redefinir">
        <div class="card-redefinir">
            <img src="logo.png" class="logo" alt="Logo Kids">
            <img src="logo3.png" class="logo2" alt="Logo Vd" style="opacity: 0.8;">
            <h2>Redefinir Senha</h2>
            <p class="subtitulo">Digite sua nova senha (apenas números)</p>

            <div id="area-form">
                <div class="input-group">
                    <label>Nova Senha (6 dígitos Numéricos)</label>
                    <input type="password" id="nova-senha-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="10">
                </div>
                <div class="input-group">
                    <label>Confirme a Senha</label>
                    <input type="password" id="confirma-senha-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••••" oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="10">
                </div>

                <button id="btn-redefinir" onclick="redefinirSenha()">Redefinir Senha</button>
                <p id="mensagem-erro" class="mensagem-erro"></p>
                <p id="mensagem-sucesso" class="mensagem-sucesso"></p>

                <button class="btn-secondary" onclick="window.location.href='index.html'" style="margin-top: 12px; padding: 10px; font-size: 0.9rem;">Voltar para o Login</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ==================== CONFIGURAÇÃO ====================
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        // ==================== FUNÇÕES AUXILIARES ====================
        function exibirErro(mensagem) {
            const el = document.getElementById('mensagem-erro');
            el.innerText = mensagem;
            el.style.display = 'block';
            el.style.color = 'var(--danger-text)';
            el.style.background = '#fdf0ee';
            el.style.borderColor = '#f5d6d2';
            document.getElementById('mensagem-sucesso').style.display = 'none';
        }

        function exibirSucesso(mensagem) {
            const el = document.getElementById('mensagem-sucesso');
            el.innerText = mensagem;
            el.style.display = 'block';
            el.style.color = 'var(--success-text)';
            el.style.background = '#d1e7dd';
            el.style.borderColor = '#b8d9c0';
            document.getElementById('mensagem-erro').style.display = 'none';
        }

        function limparMensagens() {
            document.getElementById('mensagem-erro').style.display = 'none';
            document.getElementById('mensagem-sucesso').style.display = 'none';
        }

        // ==================== REDEFINIR SENHA ====================
       async function redefinirSenha() {
            if (!recoverySessionValida) {
                exibirErro('Sessão de recuperação inválida. Solicite um novo link.');
                return;
            }
        
            const novaSenha = document.getElementById('nova-senha-input').value.trim();
            const confirmarSenha = document.getElementById('confirma-senha-input').value.trim();
            const btn = document.getElementById('btn-redefinir');
        
            limparMensagens();
        
            if (!novaSenha || !confirmarSenha) {
                exibirErro('Preencha ambos os campos.');
                return;
            }
            if (novaSenha !== confirmarSenha) {
                exibirErro('As senhas não coincidem.');
                return;
            }
            if (novaSenha.length < 6) {
                exibirErro('A senha deve ter pelo menos 6 dígitos.');
                return;
            }
            if (!/^\d+$/.test(novaSenha)) {
                exibirErro('A senha deve conter apenas números.');
                return;
            }
        
            btn.disabled = true;
            btn.innerText = 'Redefinindo...';
        
            try {
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: novaSenha
                });
        
                if (error) {
                    if (error.message.includes('invalid token')) {
                        exibirErro('O link de redefinição expirou ou é inválido. Solicite um novo.');
                    } else {
                        exibirErro('Erro ao redefinir senha: ' + error.message);
                    }
                    btn.disabled = false;
                    btn.innerText = 'Redefinir Senha';
                    return;
                }
        
                // Invalida a sessão de recuperação IMEDIATAMENTE após o uso,
                // pra garantir que não dá pra reutilizá-la nem "voltar" pra essa tela
                recoverySessionValida = false;
                await supabaseClient.auth.signOut();
        
                exibirSucesso('Senha redefinida com sucesso! Redirecionando para o login...');
                btn.innerText = 'Concluído';
        
                setTimeout(() => {
                    window.location.href = 'index.html?t=' + Date.now();
                }, 2500);
        
            } catch (err) {
                console.error(err);
                exibirErro('Erro inesperado. Tente novamente.');
                btn.disabled = false;
                btn.innerText = 'Redefinir Senha';
            }
        }
       
       // ==================== INICIALIZAÇÃO ====================
        let recoverySessionValida = false;
        
        (function init() {
            // Trava a tela até confirmarmos que é uma sessão de RECUPERAÇÃO (não login normal)
            document.getElementById('btn-redefinir').disabled = true;
        
            const { data: authListener } = supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    // Só aqui confirmamos que o usuário veio de um link de recuperação válido
                    recoverySessionValida = true;
                    document.getElementById('btn-redefinir').disabled = false;
                }
            });
        
            // Se depois de alguns segundos o evento não disparou, não é uma sessão de recuperação válida
            setTimeout(() => {
                if (!recoverySessionValida) {
                    exibirErro('Link inválido ou expirado. Solicite uma nova redefinição de senha.');
                    document.getElementById('btn-redefinir').disabled = true;
                    setTimeout(() => {
                        window.location.href = 'index.html?t=' + Date.now();
                    }, 2500);
                }
            }, 3000);
        })();
    </script>

</body>
