    <style>
        :root {
            --primary: #8b5a6a;
            --primary-dark: #6d4351;
            --primary-light: #c9a7b3;
            --accent: #d4a373;
            --accent-dark: #b9824f;
            --bg-body: #faf5f2;
            --surface: #ffffff;
            --text-main: #3d2f32;
            --text-light: #8a7a7e;
            --text-faint: #b3a29f;
            --border-color: #ece2de;
            --input-bg: #fbf7f5;
            --success: #2d6a4f;
            --success-bg: #eaf6ed;
            --danger: #b34a4a;
            --danger-bg: #fbebeb;
            --room-kids: #3d7a8c;
            --room-babys: #c98a3e;
            --room-juvenis: #7a5ca3;
            --room-todos: #2d6a4f;
            --radius-sm: 0.7rem;
            --radius-md: 1.1rem;
            --radius-lg: 1.6rem;
            --radius-xl: 2rem;
            --shadow-sm: 0 2px 8px rgba(61, 47, 50, 0.05);
            --shadow-md: 0 8px 24px rgba(61, 47, 50, 0.08);
            --shadow-lg: 0 16px 40px rgba(61, 47, 50, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 6rem;
        }

       /* ===== TOPBAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(120deg, #6d4351 0%, #8b5a6a 55%, #96637a 100%);
            color: white;
            padding: 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-lg);
            gap: 0.5rem;
            flex-wrap: nowrap;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0; /* permite encolher */
            flex-shrink: 1;
        }
        .topbar-logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.2);
            padding: 2px;
            flex-shrink: 0;
        }
        .topbar-brand h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1.1;
            white-space: nowrap;
        }
        .topbar-brand span {
            font-size: 0.65rem;
            opacity: 0.85;
            font-weight: 500;
            display: block;
            white-space: nowrap;
        }
        .topbar-actions {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.14);
            border: none;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(2px);
        }
        .icon-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* ===== LAYOUT ===== */
        .page {
            max-width: 780px;
            margin: 0 auto;
            padding: 1.2rem 1.1rem 0;
        }

        /* ===== SESSION STRIP ===== */
        .session-strip {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin-bottom: 1.1rem;
        }
        .session-strip-icon {
            width: 38px; height: 38px;
            border-radius: 0.8rem;
            background: var(--success-bg);
            color: var(--success);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .session-strip-field { flex: 1; min-width: 0; }
        .session-strip-field label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-light);
            margin-bottom: 0.15rem;
        }
        .session-strip select {
            border: none;
            background: transparent;
            padding: 0;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-main);
            width: 100%;
            cursor: pointer;
        }
        .session-strip select:focus { outline: none; }
        .btn-ghost {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 0.55rem 0.9rem;
            border-radius: 0.9rem;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            display: flex; align-items: center; gap: 0.35rem;
            transition: 0.2s;
        }
        .btn-ghost:hover { background: #f3e7e2; }

        /* ===== SCANNER HERO ===== */
        .scanner-hero {
            background: linear-gradient(160deg, #ffffff 0%, #fdf7f4 100%);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.1rem;
            position: relative;
            overflow: hidden;
        }
        .scanner-hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 160px; height: 160px;
            background: radial-gradient(circle, rgba(212,163,115,0.18), transparent 70%);
            border-radius: 50%;
        }
        .scanner-hero-head {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 1.1rem;
            position: relative;
        }
        .scanner-hero-icon {
            width: 44px; height: 44px;
            border-radius: 1rem;
            background: var(--primary);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .btn-visitante-discreto:hover {
            background: var(--input-bg);
        }
        .scanner-hero-head h2 { font-size: 1.05rem; font-weight: 700; }
        .scanner-hero-head p { font-size: 0.78rem; color: var(--text-light); margin-top: 0.1rem; }

        .scanner-area { text-align: center; position: relative; }
        #reader {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .scanner-buttons {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            margin-top: 1.1rem;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 6px 16px rgba(139,90,106,0.28);
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover { background: #f3e7e2; }
        .btn-danger { background: var(--danger); color: white; border: none; }
        .btn-danger:hover { background: #963d3d; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #235640; }

        #cameraSelect {
            margin: 0.9rem auto 0;
            display: block;
            max-width: 320px;
            padding: 0.55rem 0.9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            font-size: 0.82rem;
        }
        .scan-result {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            text-align: center;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* ===== TABS (segmented) ===== */
        .present-card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 1.3rem;
            margin-bottom: 1.5rem;
        }
        .tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 1.2rem;
            background: var(--input-bg);
            padding: 0.3rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.55rem 0.4rem;
            border-radius: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(139,90,106,0.3);
        }
        .tab:hover:not(.active) { background: #f3e7e2; color: var(--text-main); }

        /* ===== LISTA DE PRESENTES ===== */
        .present-item {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            margin-bottom: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            transition: 0.2s;
            border-left: 4px solid var(--success);
        }
        .present-item:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
        .visitant-item { border-left-color: var(--accent); background: #fdf6ec; }
        .present-info { display: flex; flex-direction: column; gap: 0.25rem; }
        .present-name { font-weight: 700; color: var(--text-main); font-size: 0.95rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .present-time { font-size: 0.72rem; color: var(--text-light); font-weight: 500; }
        .present-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .btn-icon {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-main);
        }
        .btn-icon:hover { background: #f3e7e2; transform: scale(1.03); }
        .btn-icon.btn-danger { background: var(--danger-bg); border-color: #edd3d3; color: var(--danger); }
        .btn-icon.btn-danger:hover { background: #f7dcdc; }

        /* ===== FAB ===== */
        .fab-visitante {
            position: fixed;
            bottom: 1.6rem;
            right: 1.6rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            width: 58px;
            height: 58px;
            border-radius: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 24px rgba(212,163,115,0.45);
            transition: all 0.2s;
            z-index: 100;
        }
        .fab-visitante:hover { transform: scale(1.06) rotate(-4deg); box-shadow: 0 14px 30px rgba(212,163,115,0.55); }

        /* ===== MODAIS (bottom sheet) ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(61,47,50,0.45);
            backdrop-filter: blur(4px);
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 550px;
            border-radius: 1.8rem 1.8rem 0 0;
            padding: 1.6rem 1.5rem 2rem;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @media (min-width: 620px) {
            .modal { align-items: center; }
            .modal-content { border-radius: var(--radius-xl); }
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-content::before {
            content: '';
            display: block;
            width: 40px; height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            margin: -0.4rem auto 1rem;
        }
        @media (min-width: 620px) {
            .modal-content::before { display: none; }
        }
        .modal-close {
            position: absolute;
            top: 1.1rem;
            right: 1.2rem;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-faint);
            transition: 0.2s;
            background: var(--input-bg);
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text-main); background: #f0e6e2; }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.1rem;
            color: var(--text-main);
            padding-right: 2rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin: 0.35rem 0 1rem;
            font-size: 0.9rem;
            background: var(--input-bg);
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139,90,106,0.12);
            background: white;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 1.6rem;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: var(--text-main);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-xl);
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        .toast-info { background: var(--primary); }

        /* ===== ROOM LIST (modal mover de sala) ===== */
        .room-list { max-height: 400px; overflow-y: auto; }
        .room-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem 0.2rem;
            border-bottom: 1px solid var(--border-color);
        }
        .room-item:last-child { border-bottom: none; }
        .room-item img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }

        /* ===== BADGE ===== */
        .badge {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.55rem;
            border-radius: var(--radius-xl);
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-light);
        }

        /* ===== RELATÓRIO (PDF) ===== */
        .report-container { font-family: 'Inter', sans-serif; color: #3d2f32; padding: 0.5rem; }
        .report-header { text-align: center; margin-bottom: 1.2rem; }
        .report-header img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 0.4rem; }
        .report-title { font-size: 1.3rem; font-weight: 800; color: #8b5a6a; }
        .report-subtitle { font-size: 0.9rem; color: #8a7a7e; margin-top: 0.2rem; }
        .stats-grid { display: flex; gap: 0.7rem; margin-bottom: 1.2rem; }
        .stat-card {
            flex: 1;
            background: #faf5f2;
            border: 1px solid #ece2de;
            border-radius: 0.9rem;
            padding: 0.8rem;
            text-align: center;
        }
        .stat-number { font-size: 1.4rem; font-weight: 800; color: #8b5a6a; }
        .stat-label { font-size: 0.68rem; color: #8a7a7e; font-weight: 600; margin-top: 0.15rem; }
        .report-container table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        .report-container th {
            background: #8b5a6a; color: white; padding: 0.5rem 0.6rem;
            font-size: 0.75rem; text-align: left; font-weight: 600;
        }
        .report-container td {
            padding: 0.45rem 0.6rem; font-size: 0.78rem;
            border-bottom: 1px solid #ece2de;
        }
        .report-container tr.birthday { background: #fdf6ec; }
        .report-container h3 { margin-top: 1.2rem; margin-bottom: 0.5rem; font-size: 1rem; color: #3d2f32; }

        /* ===== MODAL RELATÓRIOS ===== */
        .tab-relatorio {
            background: none;
            border: none;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .tab-relatorio.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-relatorio:hover {
            color: var(--text-main);
        }
        .aba-relatorio {
            animation: fadeIn 0.3s ease;
        }
        
        /* Estilos para o PDF (serão aplicados na impressão) */
        .report-pdf {
            font-family: 'Inter', sans-serif;
            color: #3d2f32;
            padding: 20px;
            background: white;
        }
        .report-pdf .header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .report-pdf .header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .report-pdf .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 5px 0 0;
        }
        .report-pdf .header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .report-pdf .stats-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .report-pdf .stat-card {
            flex: 1;
            background: #faf5f2;
            border: 1px solid #ece2de;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .report-pdf .stat-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
        }
        .report-pdf .stat-label {
            font-size: 0.7rem;
            color: var(--text-light);
            font-weight: 600;
        }
        .report-pdf table {

        async function loadCameras() {
            try {
                const allCameras = await Html5Qrcode.getCameras();
                const backCameras = allCameras.filter(cam => {
                    const label = cam.label.toLowerCase();
                    return label.includes('back') || label.includes('traseira') || label.includes('environment') || label.includes('câmera traseira');
                });
                availableCameras = backCameras.length > 0 ? backCameras : allCameras;
                // Restaurar a câmera salva
                const savedCameraId = localStorage.getItem('kidsCheckinCameraId');
                if (savedCameraId && availableCameras.some(c => c.id === savedCameraId)) {
                    currentCameraIndex = availableCameras.findIndex(c => c.id === savedCameraId);
                    if (currentCameraIndex === -1) currentCameraIndex = 0;
                } else {
                    currentCameraIndex = 0;
                    if (availableCameras.length) {
                        localStorage.setItem('kidsCheckinCameraId', availableCameras[0].id);
                    }
                }
            } catch (e) {
                console.log('Não foi possível listar câmeras', e);
            }
        }

        async function startScanner() {
            if (scannerActive) return;
            html5QrCode = new Html5Qrcode("reader");
            if (!availableCameras.length) await loadCameras();
        
            // Determina o ID da câmera a usar
            const savedCameraId = localStorage.getItem('kidsCheckinCameraId');
            let chosenCameraId = null;
            if (savedCameraId && availableCameras.some(c => c.id === savedCameraId)) {
                chosenCameraId = savedCameraId;
                // Atualiza o índice atual para a câmera salva
                const idx = availableCameras.findIndex(c => c.id === savedCameraId);
                if (idx !== -1) currentCameraIndex = idx;
            } else {
                // Se não houver salva, usa a primeira (traseira)
                chosenCameraId = availableCameras[0]?.id || null;
                if (chosenCameraId) {
                    localStorage.setItem('kidsCheckinCameraId', chosenCameraId);
                    currentCameraIndex = 0;
                }
            }
        
            try {
                const cameraConfig = chosenCameraId ? { deviceId: { exact: chosenCameraId } } : { facingMode: "environment" };
                await html5QrCode.start(cameraConfig, { fps: 10, qrbox: 250 }, onScanSuccess, onScanError);
                scannerActive = true;
                document.getElementById('startScannerBtn').style.display = 'none';
                document.getElementById('stopScannerBtn').style.display = 'inline-block';
                showToast('Câmera ativada', 'success');
            } catch(e) {
                showToast('Erro ao acessar câmera: '+e, 'error');
            }
        }

        function stopScanner() {
            if (html5QrCode && scannerActive) {
                html5QrCode.stop();
                scannerActive = false;
                document.getElementById('startScannerBtn').style.display = 'inline-block';
                document.getElementById('stopScannerBtn').style.display = 'none';
                showToast('Câmera desativada', 'info');
            }
            if (autoRestartScanner) clearTimeout(autoRestartScanner);
        }

        async function onScanSuccess(decodedText) {
            stopScanner();
            await processToken(decodedText);
        }

        function onScanError(err) { console.log(err); }

        // ========== PROCESSAR TOKEN (check‑in / checkout) – MESMO CÓDIGO ==========
        async function processToken(token) {
            const { data: tokenData, error: tokenError } = await supabaseClient
                .from('kids_temporary_tokens')
                .select('*, child:child_id(id, name, allergies, birth_date, photo_url, family:family_id(father_name, father_phone, mother_name, mother_phone))')
                .eq('token', token)
                .single();
            if (tokenError || !tokenData) {
                document.getElementById('scanResult').innerHTML = '❌ QR inválido.';
                showToast('QR inválido', 'error');
                return;
            }
            if (new Date(tokenData.expires_at) < new Date()) {
                document.getElementById('scanResult').innerHTML = '❌ QR expirado.';
                showToast('QR expirado', 'error');
                return;
            }
            const childId = tokenData.child_id;
            const childName = tokenData.child?.name || 'Criança';
            const allergies = tokenData.child?.allergies || '';
            const { data: activeCheckin } = await supabaseClient
                .from('kids_check_ins')
                .select('id')
                .eq('child_id', childId)
                .eq('session_id', currentSessionId)
                .is('checked_out_at', null)
                .maybeSingle();
            if (activeCheckin) {
                openCheckoutConfirmModal(childId, activeCheckin.id);
                document.getElementById('scanResult').innerHTML = `🔔 Escaneado: ${childName}`;
                return;
            }
            const birthDate = tokenData.child?.birth_date || null;
            const photoUrl = tokenData.child?.photo_url || null;
            const family = tokenData.child?.family || {};
            pendingCheckinData = {
                tokenId: tokenData.id,
                childId: childId,
                childName: childName,
                allergies: allergies,
                birthDate: birthDate,
                tokenValue: token
            };
            openSelectRoomModal(childName, allergies, birthDate, {
                photoUrl,
                fatherName: family.father_name,
                fatherPhone: family.father_phone,
                motherName: family.mother_name,
                motherPhone: family.mother_phone
            });
        }

        // ========== CALCULAR IDADE ==========
        function calcularIdade(birthDateStr) {
            if (!birthDateStr) return 0;
            const birth = new Date(birthDateStr);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

                    idade = `${idadeNum} anos`;

                const isVisitor = !!childData.is_visitor;
                const fatherPhone = isVisitor ? (childData.visitor_responsible_phone || 'Não informado') : (family.father_phone || 'Não informado');
                const motherPhone = isVisitor ? '' : (family.mother_phone || 'Não informado');
                printLabel(tokenValue, childName, allergies, idade, fatherPhone, motherPhone, newCheckin.id, {
                    isVisitor,
                    respName: childData.visitor_responsible_name || ''
                });
                enviarPush({
                    event: 'checkin',
                    checkinId: newCheckin.id,
                    childId: childId,
                    childName: childName,
                    room: room
                });
            }
            closeSelectRoomModal();
        }

                .from('kids_check_ins')
                .select('*, child:child_id(id, name, allergies, birth_date, photo_url, is_visitor)')
                .eq('session_id', currentSessionId)
                .is('checked_out_at', null);
            if (currentRoomFilter !== 'todos') {
                query = query.eq('room', currentRoomFilter);
            }
            const { data: allCheckins } = await query;
            let checkins = allCheckins;
            if (currentRoomFilter !== 'todos') {
                checkins = allCheckins?.filter(c => c.room === currentRoomFilter) || [];
            }
            let html = '';
            /*if (currentRoomFilter !== 'todos') {
                html += `
                    <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
                        <button class="btn-secondary" onclick="openRoomModal('${currentRoomFilter}')" style="display:flex; align-items:center; gap:0.4rem;">
                            <span>🔄</span> Gerenciar crianças nesta sala
                        </button>
                    </div>
                `;

            if (checkins?.length) {
                html += `<h4 style="margin-bottom:0.8rem; color:var(--primary);">Presentes ${currentRoomFilter !== 'todos' ? `(Sala: ${currentRoomFilter})` : ''}</h4>`;
                for (const c of checkins) {
                    let isBirthdayWeek = false;
                    if (c.child.birth_date) {
                        const birth = new Date(c.child.birth_date);
                        const today = new Date();
                        const weekLater = new Date();
                        weekLater.setDate(today.getDate() + 7);
                        const birthThisYear = new Date(today.getFullYear(), birth.getMonth(), birth.getDate());
                        if (birthThisYear >= today && birthThisYear <= weekLater) isBirthdayWeek = true;
                    }
                    const birthdayIcon = isBirthdayWeek ? '🎂 ' : '';
                    const isVisitor = !!c.child.is_visitor;
                    html += `
                        <div class="present-item ${isVisitor ? 'visitant-item' : ''}" style="border-left-color: ${isVisitor ? 'var(--accent)' : (c.room === 'Kids' ? '#3b82f6' : (c.room === 'Babys' ? '#f59e0b' : (c.room === 'Juvenis' ? '#8b5cf6' : 'var(--success-text)')))}; padding:0.5rem 0.7rem; position:relative;">

        // ========== CHECKOUT MANUAL ==========
        async function checkoutManual(checkinId) {
            await supabaseClient.from('kids_check_ins').update({ checked_out_at: new Date().toISOString() }).eq('id', checkinId);
            const { data: token } = await supabaseClient.from('kids_temporary_tokens').select('id').eq('checkin_id', checkinId).single();
            if (token) await supabaseClient.from('kids_temporary_tokens').update({ expires_at: new Date().toISOString() }).eq('id', token.id);
            enviarPush({ event: 'checkout', checkinId: checkinId });
            await loadPresentList();
            showToast('Check‑out manual realizado', 'success');
        }

        // ========== ROOM MODAL ==========
        async function openRoomModal(roomName) {
            pendingRoom = roomName;
            const { data: checkins } = await supabaseClient
                .from('kids_check_ins')
                .select('id, child_id, child:child_id(id, name, birth_date, photo_url)')
                .eq('session_id', currentSessionId)
                .is('checked_out_at', null);
            if (!checkins?.length) {
                showToast('Não há crianças presentes', 'error');
                return;
            }
            const { data: assigned } = await supabaseClient
                .from('kids_check_ins')
                .select('id, room')
                .eq('session_id', currentSessionId)
                .in('id', checkins.map(c => c.id));
            const roomMap = new Map();
            assigned?.forEach(a => roomMap.set(a.id, a.room));
            childrenForRoom = checkins.map(c => ({
                checkinId: c.id,
                childId: c.child_id,
                name: c.child.name,
                photo: c.child.photo_url,
                birth_date: c.child.birth_date,
                currentRoom: roomMap.get(c.id) || 'todos'
            }));
            document.getElementById('roomModalTitle').innerHTML = `Mover para sala: ${roomName}`;
            const container = document.getElementById('roomChildrenList');
            container.innerHTML = childrenForRoom.map(child => `
                <div class="room-item">
                    ${child.photo ? `<img src="${child.photo}" onerror="this.src='https://via.placeholder.com/40'">` : '<div style="width:45px;height:45px;background:var(--border-color);border-radius:50%;display:flex;align-items:center;justify-content:center;">👶</div>'}
                    <label style="flex:1;">
                        <input type="checkbox" class="room-checkbox" data-checkin-id="${child.checkinId}" ${child.currentRoom === pendingRoom ? 'checked' : ''}>
                        ${escapeHtml(child.name)} ${child.birth_date ? `(${calcularIdade(child.birth_date)} anos)` : ''}
                    </label>
                </div>
            `).join('');
            document.getElementById('roomModal').style.display = 'flex';
        }

        async function saveRoomAssignments() {
            const checkboxes = document.querySelectorAll('.room-checkbox');
            const updates = [];
            for (const cb of checkboxes) {
                const checkinId = cb.dataset.checkinId;
                const shouldAssign = cb.checked;
                if (shouldAssign) {
                    updates.push({ id: checkinId, room: pendingRoom });
                } else {
                    const child = childrenForRoom.find(c => c.checkinId == checkinId);
                    if (child && child.currentRoom === pendingRoom) {
                        updates.push({ id: checkinId, room: 'todos' });
                    }
                }
            }
            for (const upd of updates) {
                await supabaseClient.from('kids_check_ins').update({ room: upd.room }).eq('id', upd.id);
            }
            closeRoomModal();
            await loadPresentList();
            showToast('Salas atualizadas', 'success');
        }

        function closeRoomModal() { document.getElementById('roomModal').style.display = 'none'; pendingRoom = null; }

        // ========== VISITANTE ==========
        async function registerVisitant() {
            const childName = document.getElementById('visitantName').value.trim();
            const birthDate = document.getElementById('visitantBirthDate').value || null;
            const allergies = document.getElementById('visitantAllergies').value.trim();
            const respName = document.getElementById('respName').value.trim();
            const respPhone = document.getElementById('respPhone').value.trim();
            if (!childName || !respName) { showToast('Preencha nome da criança e responsável', 'error'); return; }

            // 1) Cria um registro de criança "visitante" (mesma tabela das crianças normais,
            //    só que marcado com is_visitor = true e sem família vinculada)
            const { data: child, error: childError } = await supabaseClient
                .from('kids_children')
                .insert({
                    name: childName,
                    birth_date: birthDate,
                    allergies: allergies || null,
                    is_visitor: true,
                    visitor_responsible_name: respName,
                    visitor_responsible_phone: respPhone || null
                })
                .select()
                .single();
            if (childError || !child) { showToast('Erro ao registrar visitante: ' + (childError?.message || ''), 'error'); return; }

            // 2) Gera um token temporário pra esse visitante, igual ao QR que os pais geram no painel
            const tokenValue = crypto.randomUUID();
            const expiresAt = new Date(Date.now() + 12 * 60 * 60 * 1000).toISOString(); // válido por 12h
            const { data: tokenRow, error: tokenError } = await supabaseClient
                .from('kids_temporary_tokens')
                .insert({ token: tokenValue, child_id: child.id, expires_at: expiresAt })
                .select()
                .single();
            if (tokenError || !tokenRow) { showToast('Erro ao gerar QR do visitante', 'error'); return; }

            // Limpa e fecha o modal de visitante
            document.getElementById('visitantName').value = '';
            document.getElementById('visitantBirthDate').value = '';
            document.getElementById('visitantAllergies').value = '';
            document.getElementById('respName').value = '';
            document.getElementById('respPhone').value = '';
            closeModal();

            // 3) Abre o MESMO modal de seleção de sala e segue a MESMA rotina do check-in por QR
            pendingCheckinData = {
                tokenId: tokenRow.id,
                childId: child.id,
                childName: childName,
                allergies: allergies,
                birthDate: birthDate,
                tokenValue: tokenValue
            };
            openSelectRoomModal(childName, allergies, birthDate, {
                isVisitor: true,
                respName: respName,
                respPhone: respPhone
            });
        }

                        ` : `<div style="margin-top:0.4rem; font-size:0.7rem; color:var(--text-faint);">📱 Sem número</div>`}
                    </div>
                </div>
            `;
            document.getElementById('checkoutChildInfo').innerHTML = html;
            pendingCheckoutData = { checkinId };
            document.getElementById('checkoutConfirmModal').style.display = 'flex';
        });
}

        function closeCheckoutConfirmModal() {
            document.getElementById('checkoutConfirmModal').style.display = 'none';

        async function confirmCheckout() {
            if (!pendingCheckoutData) return;
            const { checkinId } = pendingCheckoutData;
            await supabaseClient.from('kids_check_ins').update({ checked_out_at: new Date().toISOString() }).eq('id', checkinId);
            const { data: token } = await supabaseClient.from('kids_temporary_tokens').select('id').eq('checkin_id', checkinId).single();
            if (token) await supabaseClient.from('kids_temporary_tokens').update({ expires_at: new Date().toISOString() }).eq('id', token.id);
            enviarPush({ event: 'checkout', checkinId: checkinId });
            showToast('Check‑out realizado com sucesso!', 'success');
            document.getElementById('scanResult').innerHTML = `✅ Check‑out confirmado!`;

            await loadPresentList();

        // ========== GERAR PDF CONFORME TIPO ==========

        // ---------- RELATÓRIO POR MÊS ----------
        async function gerarPDFMes() {
            const mesAno = document.getElementById('relMesInput').value; // formato "YYYY-MM"
            const salaFiltro = document.getElementById('relSalaMesSelect').value;
            if (!mesAno) {
                showToast('Selecione um mês.', 'error');
                return;
            }
            const [ano, mes] = mesAno.split('-').map(Number);
            const dataInicio = new Date(ano, mes-1, 1);
            const dataFim = new Date(ano, mes, 0); // último dia do mês
        
            // Buscar check-ins do mês
            let query = supabaseClient
                .from('kids_check_ins')
                .select('*, child:child_id(id, name, birth_date, allergies, is_visitor)')
                .gte('checked_in_at', dataInicio.toISOString())
                .lte('checked_in_at', dataFim.toISOString());
            if (salaFiltro !== 'todos') {
                query = query.eq('room', salaFiltro);
            }
            const { data: allCheckinsMes } = await query;
            // Visitantes não entram no relatório de frequência mensal
            const checkins = allCheckinsMes?.filter(c => !c.child.is_visitor) || [];
        
            // Agrupar por criança
            const freqMap = {};
            checkins?.forEach(c => {
                const childId = c.child.id;
                if (!freqMap[childId]) {
                    freqMap[childId] = {
                        nome: c.child.name,
                        idade: c.child.birth_date ? `${calcularIdade(c.child.birth_date)} anos` : '',
                        alergias: c.child.allergies || 'Nenhuma',
                        presencas: 0
                    };
                }
                freqMap[childId].presencas++;
            });
        
            // Ordenar por nome
            const lista = Object.values(freqMap).sort((a,b) => a.nome.localeCompare(b.nome));
        
            const totalCriancas = lista.length;
        
            const html = `
                <div class="report-pdf" id="reportContent">
                    <div class="header">
                        <img src="logo.png" alt="Logo">
                        <h1>Relatório Mensal</h1>
                        <p>${new Date(ano, mes-1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })} - ${salaFiltro === 'todos' ? 'Todas as salas' : `Sala ${salaFiltro}`}</p>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${totalCriancas}</div><div class="stat-label">Total de crianças</div></div>
                        <div class="stat-card"><div class="stat-number">${checkins?.length || 0}</div><div class="stat-label">Total de presenças</div></div>
                    </div>
                    <table>
                        <thead><tr><th>Nome</th><th>Idade</th><th>Alergias</th><th>Presenças</th></tr></thead>
                        <tbody>
                            ${lista.map(c => `
                                <tr>
                                    <td>${escapeHtml(c.nome)}</td>
                                    <td>${c.idade}</td>
                                    <td>${escapeHtml(c.alergias)}</td>
                                    <td>${c.presencas}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="footer">Relatório gerado em ${new Date().toLocaleString('pt-BR')}</div>
                </div>
            `;
        
            gerarPDFComHtml(html, `DK_Mes_${mesAno}`);
        }
        
        // ---------- RELATÓRIO DE FALTAS ----------
        async function gerarPDFFaltas() {
            const ano = parseInt(document.getElementById('relAnoInput').value);
            const salaFiltro = document.getElementById('relSalaFaltasSelect').value;
            if (!ano || isNaN(ano)) {
                showToast('Informe um ano válido.', 'error');
                return;
            }
        
            // Buscar todas as sessões no ano
            const { data: sessoes } = await supabaseClient
                .from('kids_sessions')
                .select('id')
                .gte('session_date', `${ano}-01-01`)
                .lte('session_date', `${ano}-12-31`);
            const totalSessoes = sessoes?.length || 0;
        
            if (totalSessoes === 0) {
                showToast('Nenhuma sessão encontrada para este ano.', 'error');
                return;
            }
        
            // Buscar check-ins do ano
            let query = supabaseClient
                .from('kids_check_ins')
                .select('*, child:child_id(id, name, birth_date, allergies, is_visitor)')
                .gte('checked_in_at', `${ano}-01-01`)
                .lte('checked_in_at', `${ano}-12-31`);
            if (salaFiltro !== 'todos') {
                query = query.eq('room', salaFiltro);
            }
            const { data: allCheckinsAno } = await query;
            // Visitantes não entram no relatório de faltas
            const checkins = allCheckinsAno?.filter(c => !c.child.is_visitor) || [];
        
            // Agrupar por criança
            const freqMap = {};
            checkins?.forEach(c => {
                const childId = c.child.id;
                if (!freqMap[childId]) {
                    freqMap[childId] = {
                        nome: c.child.name,
                        idade: c.child.birth_date ? `${calcularIdade(c.child.birth_date)} anos` : '',
                        alergias: c.child.allergies || 'Nenhuma',
                        presencas: 0
                    };
                }
                freqMap[childId].presencas++;
            });
        
            // Calcular faltas = totalSessoes - presencas
            const lista = Object.values(freqMap).map(c => ({
                ...c,
                faltas: totalSessoes - c.presencas
            })).sort((a,b) => b.faltas - a.faltas); // ranking por mais faltas
        
            // Filtrar apenas quem tem pelo menos 1 falta (ou pode mostrar todos)
            const comFaltas = lista.filter(c => c.faltas > 0);
        
            const html = `
                <div class="report-pdf" id="reportContent">
                    <div class="header">
                        <img src="logo.png" alt="Logo">
                        <h1>Relatório de Faltas</h1>
                        <p>Ano ${ano} - ${salaFiltro === 'todos' ? 'Todas as salas' : `Sala ${salaFiltro}`}</p>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-number">${comFaltas.length}</div><div class="stat-label">Crianças com faltas</div></div>
                        <div class="stat-card"><div class="stat-number">${totalSessoes}</div><div class="stat-label">Total de sessões</div></div>
                        <div class="stat-card"><div class="stat-number">${checkins?.length || 0}</div><div class="stat-label">Total de presenças</div></div>
                    </div>
                    <table>
                        <thead><tr><th>#</th><th>Nome</th><th>Idade</th><th>Presenças</th><th>Faltas</th></tr></thead>
                        <tbody>
                            ${comFaltas.map((c, idx) => `
                                <tr>
                                    <td>${idx+1}</td>
                                    <td>${escapeHtml(c.nome)}</td>
                                    <td>${c.idade}</td>
                                    <td>${c.presencas}</td>
                                    <td style="color:${c.faltas > 5 ? 'var(--danger)' : 'var(--text-main)'}">${c.faltas}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="footer">Relatório gerado em ${new Date().toLocaleString('pt-BR')}</div>
                </div>
            `;
        
            gerarPDFComHtml(html, `DK_Faltas_${ano}`);
        }

                    </table>

                </div>
            `;
            gerarPDFComHtml(html, `DK_${child.name}`);
        }
        
        // ---------- FUNÇÃO AUXILIAR PARA GERAR PDF ----------
        function gerarPDFComHtml(htmlContent, nomeArquivo = 'relatorio') {
            // Criar um elemento temporário para o conteúdo
            const container = document.createElement('div');
            container.innerHTML = htmlContent;
            const element = container.firstElementChild;
        
            // Gerar PDF com html2pdf
            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `${nomeArquivo}.pdf`,
                html2canvas: { scale: 2, letterRendering: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
        
            // Usar o elemento encontrado
            html2pdf().from(element).set(opt).save().then(() => {
                showToast('PDF gerado com sucesso!', 'success');
            }).catch(() => {
                showToast('Erro ao gerar PDF', 'error');
            });
        
            // Fechar modal
            fecharModalRelatorio();
        }
        

        // ========== UTILITÁRIOS ==========
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
        async function logout() { window.location.href = "index.html?t=" + Date.now(); }

        // ========== AUTOMATIZAR SESSÃO DO DOMINGO ==========
        function getProximoDomingo() {
            const hoje = new Date();
            const dia = hoje.getDay(); // 0 = domingo
            const diff = dia === 0 ? 0 : 7 - dia;
            const proximoDomingo = new Date(hoje);
            proximoDomingo.setDate(hoje.getDate() + diff);
            // Ajustar para meia-noite (para comparar apenas a data)
            proximoDomingo.setHours(0, 0, 0, 0);
            return proximoDomingo;
        }
        
        async function getOrCreateSundaySession() {
            const dataDomingo = getProximoDomingo();
            const dataString = dataDomingo.toISOString().split('T')[0]; // YYYY-MM-DD
        
            // 1) Verificar se já existe uma sessão ativa para este domingo
            const { data: existente, error: buscaError } = await supabaseClient
                .from('kids_sessions')
                .select('id, name, is_active')
                .eq('session_date', dataString)
                .eq('is_active', true)
                .maybeSingle();
        
            if (buscaError) {
                console.error('Erro ao buscar sessão do domingo:', buscaError);
                return null;
            }
        
            if (existente) {
                // Já existe – usar essa
                return existente.id;
            }
        
            // 2) Não existe → criar nova sessão
            // Desativar todas as outras sessões ativas (para não ter duas ativas)
            const { error: desativarError } = await supabaseClient
                .from('kids_sessions')
                .update({ is_active: false })
                .eq('is_active', true);
        
            if (desativarError) {
                console.error('Erro ao desativar sessões antigas:', desativarError);
            }
        
            // Criar a nova sessão
            const nomeSessao = `Culto Kids - ${dataString.split('-').reverse().join('/')}`;
            const { data: nova, error: criarError } = await supabaseClient
                .from('kids_sessions')
                .insert({
                    name: nomeSessao,
                    session_date: dataString,
                    is_active: true,
                    // start_time e end_time podem ficar nulos
                })
                .select()
                .single();
        
            if (criarError) {
                console.error('Erro ao criar sessão do domingo:', criarError);
                return null;
            }
        
            return nova.id;
        }
